name: render-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SWARMLAB_TOKEN: ${{ secrets.SWARMLAB_TOKEN }}
          SWARMLAB_JOIN_CODE: ${{ secrets.SWARMLAB_JOIN_CODE }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json")
          owner=$(curl -fsS "${auth[@]}" "$api/owners" | jq -r '.[0].owner.id')
          echo "owner=$owner"

          svc_list=$(curl -fsS "${auth[@]}" "$api/services?ownerId=$owner")
          svc_id=$(printf '%s' "$svc_list" | jq -r '.[]? | (.service // .) | select(.name=="swarmlab") | .id' | head -1)
          if [ -z "$svc_id" ]; then
            payload=$(jq -n \
              --arg o "$owner" \
              --arg img "ghcr.io/vanya9554-del/swarm-lab:v11.13.0" \
              --arg tok "$SWARMLAB_TOKEN" \
              --arg join "$SWARMLAB_JOIN_CODE" \
              '{type:"web_service",name:"swarmlab",ownerId:$o,
                image:{ownerId:$o,imagePath:$img},
                autoDeploy:"no",
                serviceDetails:{env:"image",runtime:"image",plan:"free",region:"frankfurt",
                  healthCheckPath:"/ready",numInstances:1,
                  envVars:[{key:"SWARMLAB_TOKEN",value:$tok}]}}')
            code=$(curl -sS -o /tmp/service.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X POST "$api/services" -d "$payload")
            echo "create_http=$code"
            cat /tmp/service.json
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then exit 1; fi
            svc_id=$(jq -r '(.service // .).id' /tmp/service.json)
            echo "service_created=$svc_id"
          else
            echo "service_exists=$svc_id"
          fi

          pg_list=$(curl -fsS "${auth[@]}" "$api/postgres?ownerId=$owner")
          db_id=$(printf '%s' "$pg_list" | jq -r '.[]? | (.postgres // .) | select(.name=="swarmlab-db") | .id' | head -1)
          if [ -z "$db_id" ]; then
            payload=$(jq -n --arg o "$owner" '{name:"swarmlab-db",ownerId:$o,plan:"free",region:"frankfurt",version:"16",databaseName:"swarm",databaseUser:"swarm"}')
            code=$(curl -sS -o /tmp/pg.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X POST "$api/postgres" -d "$payload")
            echo "pg_create_http=$code"
            cat /tmp/pg.json
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then exit 1; fi
            db_id=$(jq -r '(.postgres // .).id' /tmp/pg.json)
          fi
          echo "db_id=$db_id"
          for i in $(seq 1 60); do
            pg=$(curl -sS "${auth[@]}" "$api/postgres/$db_id" || true)
            ps=$(printf '%s' "$pg" | jq -r '(.postgres // .).status // empty' 2>/dev/null || true)
            echo "PG_STATUS=$ps"
            if [ "$ps" = "available" ]; then break; fi
            sleep 10
          done
          internal=""
          for i in $(seq 1 60); do
            conn=$(curl -sS "${auth[@]}" "$api/postgres/$db_id/connection-info" || true)
            internal=$(printf '%s' "$conn" | jq -r '(.connectionInfo // .).internalConnectionString // empty' 2>/dev/null || true)
            if [ -n "$internal" ]; then break; fi
            sleep 5
          done
          if [ -z "$internal" ]; then echo "no internal db"; exit 1; fi
          envs=$(jq -n --arg db "$internal" --arg tok "$SWARMLAB_TOKEN" --arg join "$SWARMLAB_JOIN_CODE" '[{key:"SWARMLAB_DB",value:$db},{key:"SWARMLAB_TOKEN",value:$tok},{key:"SWARMLAB_JOIN_CODE",value:$join}]')
          code=$(curl -sS -o /tmp/env.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X PUT "$api/services/$svc_id/env-vars" -d "$envs")
          echo "env_update_http=$code"
          cat /tmp/env.json
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X POST "$api/services/$svc_id/deploys" -d '{}')
          echo "deploy_http=$code"
          cat /tmp/deploy.json
          for i in $(seq 1 60); do
            dlist=$(curl -sS "${auth[@]}" "$api/services/$svc_id/deploys?limit=1" || true)
            ds=$(printf '%s' "$dlist" | jq -r '.[0]? | (.deploy // .) | .status // empty' 2>/dev/null || true)
            echo "DEPLOY_STATUS=$ds"
            if [ "$ds" = "live" ]; then break; fi
            if [ "$ds" = "build_failed" ] || [ "$ds" = "update_failed" ] || [ "$ds" = "canceled" ]; then echo "deploy failed"; exit 1; fi
            sleep 10
          done

          patch=$(jq -n --arg o "$owner" --arg img "ghcr.io/vanya9554-del/swarm-lab:v11.13.0" '{image:{ownerId:$o,imagePath:$img}}')
          code=$(curl -sS -o /tmp/patch.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X PATCH "$api/services/$svc_id" -d "$patch")
          echo "image_patch_http=$code"
          cat /tmp/patch.json
          code=$(curl -sS -o /tmp/deploy2.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X POST "$api/services/$svc_id/deploys" -d '{}')
          echo "deploy2_http=$code"
          cat /tmp/deploy2.json
          for i in $(seq 1 60); do
            dlist=$(curl -sS "${auth[@]}" "$api/services/$svc_id/deploys?limit=1" || true)
            ds=$(printf '%s' "$dlist" | jq -r '.[0]? | (.deploy // .) | .status // empty' 2>/dev/null || true)
            echo "DEPLOY2_STATUS=$ds"
            if [ "$ds" = "live" ]; then break; fi
            if [ "$ds" = "build_failed" ] || [ "$ds" = "update_failed" ]; then exit 1; fi
            sleep 10
          done

          code=$(curl -sS -o /tmp/restart.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X POST "$api/services/$svc_id/restart")
          echo "restart_http=$code"
          cat /tmp/restart.json
          sleep 20

          echo "ENV_KEYS:"
          env_list=$(curl -sS "${auth[@]}" "$api/services/$svc_id/env-vars" || true)
          printf '%s' "$env_list" | jq -r '.[]? | (.envVar // .) | .key' || true
          echo "DEPLOYS:"
          deploys=$(curl -sS "${auth[@]}" "$api/services/$svc_id/deploys?limit=5" || true)
          printf '%s' "$deploys" | jq -r '.[]? | (.deploy // .) | [.id,.status,.createdAt] | @tsv' || true

          url=""
          for i in $(seq 1 60); do
            svc=$(curl -sS "${auth[@]}" "$api/services/$svc_id" || true)
            url=$(printf '%s' "$svc" | jq -r '(.serviceDetails.url // .service.serviceDetails.url // empty)' 2>/dev/null || true)
            status=$(printf '%s' "$svc" | jq -r '(.suspended // .service.suspended // empty)' 2>/dev/null || true)
            if [ -n "$url" ] && [ "$status" != "suspended" ]; then break; fi
            sleep 5
          done
          echo "SERVICE_URL=$url"
          echo "DASHBOARD=https://dashboard.render.com/web/$svc_id"
          if [ -n "$url" ]; then
            code="000"
            for i in $(seq 1 60); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/ready" || true)
              if [ "$code" = "200" ]; then break; fi
              sleep 5
            done
            echo "READY_HTTP=$code"
            backend=""
            for i in $(seq 1 60); do
              ready=$(curl -sS "$url/ready" || true)
              backend=$(printf '%s' "$ready" | jq -r '.backend // empty' 2>/dev/null || true)
              if [ "$backend" = "postgres" ]; then echo "BACKEND=$backend"; echo "$ready"; break; fi
              sleep 5
            done
            if [ "$backend" != "postgres" ]; then echo "BACKEND=$backend"; echo "not postgres"; fi
            echo "LLMS:"; curl -sS "$url/llms.txt" | head -5 || true
            echo "AGENTS:"; curl -sS "$url/agents.json" | head -c 300 || true
            reg=$(curl -sS -X POST -H 'Content-Type: application/json' -d "{\"agent_id\":\"ci-agent\",\"capabilities\":[\"echo\"],\"join_code\":\"$SWARMLAB_JOIN_CODE\"}" "$url/v1/agents/register")
            echo "REGISTER:"; printf '%s' "$reg" | jq '{ok,agent:.data.agent.agent_id,has_token:(.data.token != null)}' || true
            at=$(printf '%s' "$reg" | jq -r '.data.token // empty')
            if [ -n "$at" ]; then echo "AUTH:"; curl -sS -o /dev/null -w '%{http_code}\n' -H "Authorization: Bearer $at" "$url/v1/stats"; fi
          fi
