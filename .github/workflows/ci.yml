name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . ruff coverage
      - run: python -m ruff check swarmlab tests scripts
      - run: python scripts/validate_manifests.py
      - run: python -m coverage run --source=swarmlab --omit=swarmlab/pg.py -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=90


  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swarmlab:ci .
      - run: docker run --rm swarmlab:ci python -m swarmlab --version

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/swarmlab
      - run: helm template sqlite deploy/helm/swarmlab > /tmp/sqlite.yaml
      - run: helm template pg deploy/helm/swarmlab -f deploy/helm/swarmlab/ci/postgres-values.yaml > /tmp/pg.yaml
      - run: 'grep -q "kind: HorizontalPodAutoscaler" /tmp/pg.yaml'
      - run: 'grep -q "kind: ServiceMonitor" /tmp/pg.yaml'
      - run: 'grep -q "kind: PrometheusRule" /tmp/pg.yaml'
      - run: |
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -ignore-missing-schemas -summary /tmp/sqlite.yaml /tmp/pg.yaml

