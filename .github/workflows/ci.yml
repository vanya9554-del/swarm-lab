name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . ruff coverage
      - run: python -m ruff check swarmlab tests scripts
      - run: python -m coverage run --source=swarmlab -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=55
