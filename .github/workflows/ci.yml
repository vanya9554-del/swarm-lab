name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[oidc]" ruff coverage
      - run: python -m ruff check swarmlab tests scripts
      - run: python scripts/validate_manifests.py
      - run: python -m coverage run --source=swarmlab --omit=swarmlab/pg.py -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=90


  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swarmlab:ci .
      - run: docker run --rm swarmlab:ci python -m swarmlab --version
      - run: docker build -f Dockerfile.maintenance -t swarmlab-maintenance:ci .
      - run: docker run --rm swarmlab-maintenance:ci --help
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: swarmlab:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint deploy/helm/swarmlab
      - run: helm template sqlite deploy/helm/swarmlab > /tmp/sqlite.yaml
      - run: helm template pg deploy/helm/swarmlab -f deploy/helm/swarmlab/ci/postgres-values.yaml > /tmp/pg.yaml
      - run: 'grep -q "kind: HorizontalPodAutoscaler" /tmp/pg.yaml'
      - run: 'grep -q "kind: ServiceMonitor" /tmp/pg.yaml'
      - run: 'grep -q "kind: PrometheusRule" /tmp/pg.yaml'
      - run: |
          helm template s3 deploy/helm/swarmlab \
            --set backup.enabled=true --set backup.s3.enabled=true \
            --set persistence.enabled=false \
            --set backup.s3.bucket=backups --set backup.s3.existingSecret=s3 \
            --set backup.s3.image.tag=test > /tmp/s3.yaml
          grep -q "scripts/backup_s3.py" /tmp/s3.yaml
          ! grep -q "kind: PersistentVolumeClaim" /tmp/s3.yaml
      - run: |
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -ignore-missing-schemas -summary /tmp/sqlite.yaml /tmp/pg.yaml


  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit ".[oidc]" "psycopg[binary]"
      - run: python -m pip_audit --progress-spinner off

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: swarmlab-ci
      - run: docker build -t swarmlab:test .
      - run: kind load docker-image swarmlab:test --name swarmlab-ci
      - uses: azure/setup-helm@v4
      - name: Install chart
        run: |
          helm install ci deploy/helm/swarmlab \
            --set image.repository=swarmlab --set image.tag=test --set image.pullPolicy=Never \
            --set persistence.enabled=false --set auth.enabled=false \
            --set networkPolicy.enabled=false --set pdb.enabled=false \
            --set serviceMonitor.enabled=false --set prometheusRule.enabled=false \
            --timeout 180s
          sleep 5
          kubectl get pods -o wide
          kubectl describe pod -l app.kubernetes.io/instance=ci || true
          kubectl logs -l app.kubernetes.io/instance=ci --tail=100 || true
          kubectl get events --sort-by=.lastTimestamp | tail -20 || true
          kubectl rollout status deploy/ci-swarmlab --timeout=120s
      - name: Server-side validation
        run: |
          helm template ci deploy/helm/swarmlab \
            --set image.repository=swarmlab --set image.tag=test \
            --set persistence.enabled=false --set auth.enabled=false \
            --set networkPolicy.enabled=false --set pdb.enabled=false > /tmp/render.yaml
          kubectl apply --dry-run=server -f /tmp/render.yaml
      - name: Smoke
        run: |
          kubectl port-forward svc/ci-swarmlab 8788:80 >/tmp/pf.log 2>&1 &
          sleep 3
          curl -fsS --retry 10 --retry-delay 2 http://127.0.0.1:8788/ready
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"capability":"echo","payload":{"x":1}}' \
            http://127.0.0.1:8788/v1/tasks
      - name: Rolling upgrade
        run: |
          helm upgrade ci deploy/helm/swarmlab \
            --set image.repository=swarmlab --set image.tag=test --set image.pullPolicy=Never \
            --set persistence.enabled=false --set auth.enabled=false \
            --set networkPolicy.enabled=false --set pdb.enabled=false \
            --set config.rateRps=10 --timeout 120s
          kubectl rollout status deploy/ci-swarmlab --timeout=120s
      - name: Install ingress and cert-manager
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --create-namespace \
            --set controller.service.type=ClusterIP --wait --timeout 180s
          helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace \
            --set crds.enabled=true --wait --timeout 180s
          kubectl apply -f - <<'EOF'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: selfsigned
          spec:
            selfSigned: {}
          EOF
      - name: TLS ingress smoke
        run: |
          helm upgrade ci deploy/helm/swarmlab -f deploy/helm/swarmlab/ci/tls-values.yaml \
            --set image.repository=swarmlab --set image.tag=test --set image.pullPolicy=Never \
            --set persistence.enabled=false --set auth.enabled=false \
            --set networkPolicy.enabled=false --set pdb.enabled=false --wait --timeout 180s
          kubectl wait --for=condition=Ready certificate/swarmlab-tls --timeout=120s
          kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 8443:443 >/tmp/ingress-pf.log 2>&1 &
          sleep 5
          curl -kfsS --resolve swarm.local:8443:127.0.0.1 https://swarm.local:8443/ready

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install bandit
      - run: python -m bandit -r swarmlab -q -c .bandit

  s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e ".[s3]" "moto[server]"
          python -m moto.server -p 9000 >/tmp/moto.log 2>&1 &
          sleep 3
          python - <<'PY'
          from swarmlab.store import SwarmStore
          s = SwarmStore("data/test.db"); s.register("a", ["x"]); s.close()
          PY
          python scripts/backup_s3.py --db data/test.db --bucket backups --key swarm.db \
            --endpoint http://127.0.0.1:9000 --access-key minio --secret-key minio123
          python - <<'PY'
          import boto3
          c = boto3.client("s3", endpoint_url="http://127.0.0.1:9000",
                           aws_access_key_id="minio", aws_secret_access_key="minio123")
          assert c.head_object(Bucket="backups", Key="swarm.db")["ContentLength"] > 0
          print("s3 backup ok")
          PY

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swarmlab:dast .
      - run: docker run -d --name swarmlab-dast --network host swarmlab:dast
      - run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8788/ready && break || sleep 1; done
      - run: |
          mkdir -p zap
          chmod 777 zap
      - run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8788/ready -J report.json -I -m 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap/report.json
      - run: docker logs swarmlab-dast || true
        if: always()

  kind-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: swarmlab-pg
      - run: docker build -t swarmlab:test .
      - run: kind load docker-image swarmlab:test --name swarmlab-pg
      - uses: azure/setup-helm@v4
      - name: PostgreSQL
        run: |
          kubectl apply -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: pg}
          spec:
            replicas: 1
            selector: {matchLabels: {app: pg}}
            template:
              metadata: {labels: {app: pg}}
              spec:
                containers:
                  - name: pg
                    image: postgres:16
                    env:
                      - {name: POSTGRES_PASSWORD, value: pass}
                      - {name: POSTGRES_DB, value: swarm}
                    ports: [{containerPort: 5432}]
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: pg}
          spec:
            selector: {app: pg}
            ports: [{port: 5432, targetPort: 5432}]
          EOF
          kubectl rollout status deploy/pg --timeout=180s
          kubectl create secret generic pg-dsn --from-literal=dsn='postgresql://postgres:pass@pg:5432/swarm'
      - name: Metrics server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deploy metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deploy/metrics-server --timeout=180s
      - name: Install PG chart + HPA
        run: |
          helm install ci deploy/helm/swarmlab \
            --set image.repository=swarmlab --set image.tag=test --set image.pullPolicy=Never \
            --set postgresql.enabled=true --set postgresql.existingSecret=pg-dsn \
            --set persistence.enabled=false --set auth.enabled=false \
            --set networkPolicy.enabled=false --set serviceMonitor.enabled=false \
            --set prometheusRule.enabled=false --set pdb.enabled=true --set pdb.minAvailable=1 \
            --set autoscaling.enabled=true --set autoscaling.minReplicas=2 --set autoscaling.maxReplicas=4 \
            --timeout 240s
          sleep 8
          kubectl get pods -o wide
          kubectl describe pod -l app.kubernetes.io/instance=ci || true
          kubectl logs -l app.kubernetes.io/instance=ci --tail=120 || true
          kubectl get events --sort-by=.lastTimestamp | tail -20 || true
          kubectl get hpa
          kubectl rollout status deploy/ci-swarmlab --timeout=120s
      - name: Smoke PG
        run: |
          kubectl port-forward svc/ci-swarmlab 8788:80 >/tmp/pf-pg.log 2>&1 &
          sleep 3
          curl -fsS --retry 10 --retry-delay 2 http://127.0.0.1:8788/ready
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"capability":"echo","payload":{"x":1}}' http://127.0.0.1:8788/v1/tasks

  kind-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: swarmlab-backup
      - run: docker build -t swarmlab:test .
      - run: kind load docker-image swarmlab:test --name swarmlab-backup
      - uses: azure/setup-helm@v4
      - name: local-path storage
        run: |
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml
          kubectl -n local-path-storage rollout status deploy/local-path-provisioner --timeout=120s
          kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
      - name: Install with backup
        run: |
          helm install ci deploy/helm/swarmlab \
            --set image.repository=swarmlab --set image.tag=test --set image.pullPolicy=Never \
            --set persistence.enabled=true --set persistence.size=1Gi \
            --set backup.enabled=true --set backup.storage.size=1Gi \
            --set auth.enabled=false --set networkPolicy.enabled=false \
            --set pdb.enabled=false --set serviceMonitor.enabled=false \
            --set prometheusRule.enabled=false --timeout 240s
          kubectl rollout status deploy/ci-swarmlab --timeout=180s
      - name: Create task and backup
        run: |
          kubectl port-forward svc/ci-swarmlab 8788:80 >/tmp/pf-backup.log 2>&1 &
          sleep 3
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"capability":"backup","payload":{"n":1}}' http://127.0.0.1:8788/v1/tasks
          kubectl create job --from=cronjob/ci-swarmlab-backup backup-1
          kubectl wait --for=condition=complete job/backup-1 --timeout=120s
          kubectl logs job/backup-1
      - name: Verify + restore drill
        run: |
          cat > /tmp/check.json <<'EOF'
          {"spec":{"containers":[{"name":"c","image":"swarmlab:test","imagePullPolicy":"Never","command":["python","-c","import glob,shutil,sqlite3; f=sorted(glob.glob('/backup/*.db'))[-1]; print('backup',f); shutil.copy(f,'/data/restored.db'); c=sqlite3.connect('/data/restored.db'); print('tasks',c.execute('select count(*) from tasks').fetchone()[0]); assert c.execute('pragma quick_check').fetchone()[0]=='ok'"],"volumeMounts":[{"name":"data","mountPath":"/data"},{"name":"backup","mountPath":"/backup"}]}],"volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"ci-swarmlab-data"}},{"name":"backup","persistentVolumeClaim":{"claimName":"ci-swarmlab-backup"}}]}}
          EOF
          kubectl run backup-check --image=swarmlab:test --image-pull-policy=Never --restart=Never --overrides="$(cat /tmp/check.json)"
          kubectl wait --for=condition=Ready pod/backup-check --timeout=120s || true
          kubectl logs backup-check
          kubectl get pod backup-check -o jsonpath='{.status.phase}' | grep Succeeded
          kubectl delete pod backup-check

  kind-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: swarmlab-s3
      - run: |
          docker build -t swarmlab:test .
          docker build -f Dockerfile.maintenance -t swarmlab-maintenance:test .
          docker build -t moto:test - <<'EOF'
          FROM python:3.12-slim
          RUN pip install --no-cache-dir "moto[server]"
          CMD ["python", "-m", "moto.server", "-H", "0.0.0.0", "-p", "5000"]
          EOF
          kind load docker-image swarmlab:test --name swarmlab-s3
          kind load docker-image swarmlab-maintenance:test --name swarmlab-s3
          kind load docker-image moto:test --name swarmlab-s3
      - uses: azure/setup-helm@v4
      - name: local-path + moto
        run: |
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml
          kubectl -n local-path-storage rollout status deploy/local-path-provisioner --timeout=120s
          kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
          kubectl run moto --image=moto:test --image-pull-policy=Never --restart=Never --port=5000
          kubectl wait --for=condition=Ready pod/moto --timeout=120s
          kubectl expose pod moto --port=5000
          kubectl create secret generic s3-creds \
            --from-literal=access-key=minio --from-literal=secret-key=minio123
      - name: Install S3 backup chart
        run: |
          helm install ci deploy/helm/swarmlab \
            --set image.repository=swarmlab --set image.tag=test --set image.pullPolicy=Never \
            --set persistence.enabled=true --set persistence.size=1Gi \
            --set backup.enabled=true --set backup.s3.enabled=true \
            --set backup.s3.bucket=backups --set backup.s3.endpoint=http://moto:5000 \
            --set backup.s3.existingSecret=s3-creds \
            --set backup.s3.image.repository=swarmlab-maintenance \
            --set backup.s3.image.tag=test --set backup.s3.image.pullPolicy=Never \
            --set auth.enabled=false --set networkPolicy.enabled=false \
            --set pdb.enabled=false --set serviceMonitor.enabled=false \
            --set prometheusRule.enabled=false --timeout 240s
          kubectl rollout status deploy/ci-swarmlab --timeout=180s
      - name: Run S3 backup job
        run: |
          kubectl port-forward svc/ci-swarmlab 8788:80 >/tmp/pf-s3.log 2>&1 &
          sleep 3
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"capability":"s3","payload":{"n":1}}' http://127.0.0.1:8788/v1/tasks
          kubectl create job --from=cronjob/ci-swarmlab-backup backup-s3
          kubectl wait --for=condition=complete job/backup-s3 --timeout=180s
          kubectl logs job/backup-s3
      - name: Verify S3 object
        run: |
          kubectl create job s3check --image=swarmlab-maintenance:test -- \
            python -c "import boto3; c=boto3.client('s3',endpoint_url='http://moto:5000',aws_access_key_id='minio',aws_secret_access_key='minio123',region_name='us-east-1'); r=c.list_objects_v2(Bucket='backups'); print(r); assert r.get('KeyCount',0)>0"
          kubectl wait --for=condition=complete job/s3check --timeout=120s
          kubectl logs job/s3check

  kind-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: swarmlab-vault
      - run: docker build -t swarmlab:test .
      - run: kind load docker-image swarmlab:test --name swarmlab-vault
      - uses: azure/setup-helm@v4
      - name: Vault dev + ESO
        run: |
          helm repo add hashicorp https://helm.releases.hashicorp.com
          helm repo add external-secrets https://charts.external-secrets.io
          helm install vault hashicorp/vault -n vault --create-namespace \
            --set server.dev.enabled=true --wait --timeout 180s
          helm install external-secrets external-secrets/external-secrets \
            -n external-secrets --create-namespace --set installCRDs=true --wait --timeout 180s
          kubectl wait --for=condition=Established crd/externalsecrets.external-secrets.io --timeout=120s
          kubectl wait --for=condition=Established crd/secretstores.external-secrets.io --timeout=120s
          kubectl create secret generic vault-token --from-literal=token=root
          kubectl apply -f - <<'EOF'
          apiVersion: external-secrets.io/v1beta1
          kind: SecretStore
          metadata:
            name: vault
          spec:
            provider:
              vault:
                server: http://vault.vault.svc:8200
                path: secret
                version: v2
                auth:
                  tokenSecretRef:
                    name: vault-token
                    key: token
          ---
          apiVersion: external-secrets.io/v1beta1
          kind: ExternalSecret
          metadata:
            name: swarmlab-auth
          spec:
            refreshInterval: 1m
            secretStoreRef:
              name: vault
              kind: SecretStore
            target:
              name: ci-auth
              creationPolicy: Owner
            data:
              - secretKey: token
                remoteRef:
                  key: swarmlab
                  property: token
          EOF
          kubectl -n vault exec vault-0 -- vault kv put secret/swarmlab token="s3cr3t"
          sleep 5
          kubectl get externalsecret swarmlab-auth -o wide
          kubectl get secret ci-auth
      - name: Install with external secret
        run: |
          helm install ci deploy/helm/swarmlab \
            --set image.repository=swarmlab --set image.tag=test --set image.pullPolicy=Never \
            --set persistence.enabled=false --set auth.enabled=true \
            --set auth.existingSecret=ci-auth --set auth.tokenKey=token \
            --set networkPolicy.enabled=false --set pdb.enabled=false \
            --set serviceMonitor.enabled=false --set prometheusRule.enabled=false \
            --wait --timeout 180s
      - name: Auth smoke
        run: |
          TOKEN=$(kubectl get secret ci-auth -o jsonpath='{.data.token}' | base64 -d)
          kubectl port-forward svc/ci-swarmlab 8788:80 >/tmp/pf-vault.log 2>&1 &
          sleep 3
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8788/v1/stats
