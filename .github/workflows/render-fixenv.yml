name: render-fixenv

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Set env and restart
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SWARMLAB_TOKEN: ${{ secrets.SWARMLAB_TOKEN }}
          SWARMLAB_JOIN_CODE: ${{ secrets.SWARMLAB_JOIN_CODE }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json")
          owner=$(curl -fsS "${auth[@]}" "$api/owners" | jq -r '.[0].owner.id')
          svc=$(curl -fsS "${auth[@]}" "$api/services?ownerId=$owner" | jq -r '.[]? | (.service // .) | select(.name=="swarmlab") | .id' | head -1)
          db=$(curl -fsS "${auth[@]}" "$api/postgres?ownerId=$owner" | jq -r '.[]? | (.postgres // .) | select(.name=="swarmlab-db") | .id' | head -1)
          echo "service=$svc db=$db"
          internal=""
          for i in $(seq 1 60); do
            conn=$(curl -sS "${auth[@]}" "$api/postgres/$db/connection-info" || true)
            internal=$(printf '%s' "$conn" | jq -r '(.connectionInfo // .).internalConnectionString // empty' 2>/dev/null || true)
            [ -n "$internal" ] && break
            sleep 5
          done
          envs=$(jq -n --arg db "$internal" --arg tok "$SWARMLAB_TOKEN" --arg join "$SWARMLAB_JOIN_CODE" '[{key:"SWARMLAB_DB",value:$db},{key:"SWARMLAB_TOKEN",value:$tok},{key:"SWARMLAB_JOIN_CODE",value:$join}]')
          patch=$(jq -n --arg o "$owner" --arg img "ghcr.io/vanya9554-del/swarm-lab:v11.16.0" '{image:{ownerId:$o,imagePath:$img}}')
          icode=$(curl -sS -o /tmp/patch.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X PATCH "$api/services/$svc" -d "$patch")
          echo "image_patch_http=$icode"; cat /tmp/patch.json
          code=$(curl -sS -o /tmp/env.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X PUT "$api/services/$svc/env-vars" -d "$envs")
          echo "env_http=$code"; cat /tmp/env.json
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' -X POST "$api/services/$svc/deploys" -d '{}')
          echo "deploy_http=$code"; cat /tmp/deploy.json
          for i in $(seq 1 60); do
            ds=$(curl -sS "${auth[@]}" "$api/services/$svc/deploys?limit=1" | jq -r '.[0]? | (.deploy // .) | .status // empty' 2>/dev/null || true)
            echo "DEPLOY_STATUS=$ds"
            if [ "$ds" = "live" ]; then break; fi
            if [ "$ds" = "build_failed" ] || [ "$ds" = "update_failed" ]; then exit 1; fi
            sleep 10
          done
          url=$(curl -fsS "${auth[@]}" "$api/services/$svc" | jq -r '.serviceDetails.url')
          echo "URL=$url"
          for i in $(seq 1 90); do
            ready=$(curl -sS "$url/ready" || true)
            backend=$(printf '%s' "$ready" | jq -r '.backend // empty' 2>/dev/null || true)
            ver=$(curl -sS "$url/health" | jq -r '.version // empty' 2>/dev/null || true)
            echo "STATE backend=$backend version=$ver"
            if [ "$backend" = "postgres" ]; then echo "$ready"; break; fi
            sleep 10
          done
          echo "LLMS:"; curl -sS "$url/llms.txt" | head -3 || true
          reg=$(curl -sS -X POST -H 'Content-Type: application/json' -d "{\"agent_id\":\"ci-agent\",\"capabilities\":[\"echo\"],\"join_code\":\"$SWARMLAB_JOIN_CODE\"}" "$url/v1/agents/register")
          echo "REGISTER:"; printf '%s' "$reg" | jq '{ok,agent:.data.agent.agent_id,has_token:(.data.token != null)}' || true
