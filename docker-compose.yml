# docker-compose для swarm-lab: app (SQLite) + optional PostgreSQL profile.
services:
  app:
    build: .
    ports:
      - "8788:8788"
    environment:
      SWARMLAB_TOKEN: ${SWARMLAB_TOKEN:-}
      SWARMLAB_RATE_RPS: ${SWARMLAB_RATE_RPS:-0}
      SWARMLAB_MAX_PENDING: ${SWARMLAB_MAX_PENDING:-0}
    volumes:
      - swarm-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8788/health',timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16
    profiles: ["pg"]
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: swarm
      POSTGRES_DB: swarm
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  app-pg:
    build: .
    profiles: ["pg"]
    depends_on:
      - postgres
    ports:
      - "8789:8788"
    environment:
      SWARMLAB_TOKEN: ${SWARMLAB_TOKEN:-}
      SWARMLAB_RATE_RPS: ${SWARMLAB_RATE_RPS:-0}
    command: ["python", "-m", "swarmlab", "serve", "--db", "postgresql://swarm:swarm@postgres:5432/swarm", "--host", "0.0.0.0", "--port", "8788"]

volumes:
  swarm-data:
  pg-data:
