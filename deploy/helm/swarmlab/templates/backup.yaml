{{- if .Values.backup.enabled }}
{{- if and .Values.postgresql.enabled .Values.backup.s3.enabled }}
{{- fail "backup.s3 supports SQLite only; use PVC pg_dump for PostgreSQL" }}
{{- end }}
{{- if not .Values.backup.s3.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "swarmlab.fullname" . }}-backup
  labels:
    {{- include "swarmlab.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.backup.storage.accessMode }}]
  {{- if .Values.backup.storage.storageClass }}
  storageClassName: {{ .Values.backup.storage.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "swarmlab.fullname" . }}-backup
  labels:
    {{- include "swarmlab.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "swarmlab.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: backup
              {{- if .Values.backup.s3.enabled }}
              image: "{{ .Values.backup.s3.image.repository }}:{{ .Values.backup.s3.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.backup.s3.image.pullPolicy }}
              env:
                - name: SWARMLAB_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "backup.s3.existingSecret is required" .Values.backup.s3.existingSecret }}
                      key: {{ .Values.backup.s3.accessKeyKey }}
                - name: SWARMLAB_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.s3.existingSecret }}
                      key: {{ .Values.backup.s3.secretKeyKey }}
                - name: SWARMLAB_S3_REGION
                  value: {{ .Values.backup.s3.region | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  python scripts/backup_s3.py --db /data/swarm.db \
                    --bucket {{ .Values.backup.s3.bucket | quote }} \
                    --key "{{ .Values.backup.s3.keyPrefix }}/swarm-$(date -u +%Y%m%dT%H%M%SZ).db" \
                    --endpoint {{ .Values.backup.s3.endpoint | quote }} \
                    --region {{ .Values.backup.s3.region | quote }}
              {{- else if .Values.postgresql.enabled }}
              image: postgres:16
              env:
                - name: DSN
                  valueFrom:
                    secretKeyRef:
                      name: {{ required "postgresql.existingSecret is required when postgresql.enabled" .Values.postgresql.existingSecret }}
                      key: {{ .Values.postgresql.dsnKey }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pg_dump "$DSN" > /backup/swarm-$(date -u +%Y%m%dT%H%M%SZ).sql
                  find /backup -name 'swarm-*.sql' -mtime +{{ .Values.backup.retentionDays }} -delete
              {{- else }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["python", "-c"]
              args:
                - |
                  import datetime, glob, os, sqlite3
                  out = f"/backup/swarm-{datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')}.db"
                  src = sqlite3.connect("/data/swarm.db")
                  src.execute("VACUUM INTO ?", (out,))
                  src.close()
                  for path in glob.glob("/backup/swarm-*.db"):
                      if os.path.getmtime(path) < datetime.datetime.now().timestamp() - {{ .Values.backup.retentionDays }} * 86400:
                          os.remove(path)
              {{- end }}
              volumeMounts:
                - name: data
                  mountPath: /data
                {{- if not .Values.backup.s3.enabled }}
                - name: backup
                  mountPath: /backup
                {{- end }}
          volumes:
            - name: data
              {{- if .Values.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ default (printf "%s-data" (include "swarmlab.fullname" .)) .Values.persistence.existingClaim }}
              {{- else }}
              emptyDir: {}
              {{- end }}
            {{- if not .Values.backup.s3.enabled }}
            - name: backup
              persistentVolumeClaim:
                claimName: {{ include "swarmlab.fullname" . }}-backup
            {{- end }}
{{- end }}
