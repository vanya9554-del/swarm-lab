{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "swarmlab.fullname" . }}
  labels:
    {{- include "swarmlab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "swarmlab.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
      {{- if not .Values.networkPolicy.allowAllIngress }}
      from:
        {{- with .Values.networkPolicy.ingress }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      {{- end }}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if .Values.postgresql.enabled }}
    - ports:
        - {protocol: TCP, port: 5432}
    {{- end }}
    {{- if .Values.backup.enabled }}
    - ports:
        - {protocol: TCP, port: 443}
    {{- end }}
{{- end }}
