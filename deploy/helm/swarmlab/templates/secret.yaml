{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swarmlab.fullname" . }}-secrets
  labels:
    {{- include "swarmlab.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.tokenKey }}: {{ default "change-me" .Values.auth.token | quote }}
{{- end }}
