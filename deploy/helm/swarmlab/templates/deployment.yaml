apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swarmlab.fullname" . }}
  labels:
    {{- include "swarmlab.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "swarmlab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "swarmlab.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "swarmlab.serviceAccountName" . }}
      terminationGracePeriodSeconds: 15
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: swarmlab
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["python", "-m", "swarmlab", "serve", "--db", "$(SWARMLAB_DB)", "--host", "0.0.0.0", "--port", "{{ .Values.service.targetPort }}"]
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- include "swarmlab.databaseEnv" . | nindent 12 }}
            {{- include "swarmlab.authEnv" . | nindent 12 }}
            {{- if .Values.auth.jwtSecret.existingSecret }}
            - name: SWARMLAB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecret.existingSecret }}
                  key: {{ .Values.auth.jwtSecret.key }}
            {{- end }}
            {{- if .Values.auth.jwtPublicKey.existingSecret }}
            - name: SWARMLAB_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtPublicKey.existingSecret }}
                  key: {{ .Values.auth.jwtPublicKey.key }}
            {{- end }}
            {{- if .Values.auth.jwtJwksUrl }}
            - name: SWARMLAB_JWT_JWKS_URL
              value: {{ .Values.auth.jwtJwksUrl | quote }}
            {{- end }}
            {{- if .Values.auth.jwtIssuer }}
            - name: SWARMLAB_JWT_ISSUER
              value: {{ .Values.auth.jwtIssuer | quote }}
            {{- end }}
            {{- if .Values.auth.jwtAudience }}
            - name: SWARMLAB_JWT_AUDIENCE
              value: {{ .Values.auth.jwtAudience | quote }}
            {{- end }}
            - name: SWARMLAB_RATE_RPS
              value: {{ .Values.config.rateRps | quote }}
            - name: SWARMLAB_MAX_PENDING
              value: {{ .Values.config.maxPending | quote }}
            - name: SWARMLAB_LEASE_S
              value: {{ .Values.config.leaseS | quote }}
            - name: SWARMLAB_AGENT_TTL
              value: {{ .Values.config.agentTtl | quote }}
            - name: SWARMLAB_STREAM_KEEPALIVE_S
              value: {{ .Values.config.streamKeepaliveS | quote }}
            - name: SWARMLAB_MAX_BODY
              value: {{ .Values.config.maxBody | int | quote }}
            - name: SWARMLAB_PG_ATTEMPTS
              value: {{ .Values.config.pgAttempts | quote }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "swarmlab.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
