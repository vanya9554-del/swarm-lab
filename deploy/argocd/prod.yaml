apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swarmlab-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vanya9554-del/swarm-lab
    targetRevision: v9.3.0
    path: deploy/helm/swarmlab
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.repository
          value: ghcr.io/vanya9554-del/swarm-lab
        - name: image.tag
          value: v9.3.0
        - name: ingress.enabled
          value: "true"
        - name: ingress.hosts[0].host
          value: swarm.example.com
        - name: autoscaling.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: swarmlab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: false
      selfHeal: false
