apiVersion: v1
kind: Secret
metadata:
  name: swarmlab-secrets
type: Opaque
stringData:
  token: "change-me"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swarmlab-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmlab
  labels: {app: swarmlab}
spec:
  replicas: 1
  selector:
    matchLabels: {app: swarmlab}
  template:
    metadata:
      labels: {app: swarmlab}
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: swarmlab
          image: swarmlab:5.31.0
          ports: [{containerPort: 8788, name: http}]
          env:
            - name: SWARMLAB_TOKEN
              valueFrom:
                secretKeyRef: {name: swarmlab-secrets, key: token}
            - name: SWARMLAB_RATE_RPS
              value: "50"
          startupProbe:
            httpGet: {path: /ready, port: http}
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: swarmlab-data
---
apiVersion: v1
kind: Service
metadata:
  name: swarmlab
spec:
  selector: {app: swarmlab}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: swarmlab
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: swarmlab}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swarmlab
spec:
  podSelector:
    matchLabels: {app: swarmlab}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8788}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
