apiVersion: v1
kind: Secret
metadata:
  name: swarmlab-secrets
type: Opaque
stringData:
  token: "change-me"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swarmlab-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmlab
  labels: {app: swarmlab}
spec:
  replicas: 1
  selector:
    matchLabels: {app: swarmlab}
  template:
    metadata:
      labels: {app: swarmlab}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: swarmlab
          image: swarmlab:1.0.0
          ports: [{containerPort: 8788, name: http}]
          env:
            - name: SWARMLAB_TOKEN
              valueFrom:
                secretKeyRef: {name: swarmlab-secrets, key: token}
            - name: SWARMLAB_RATE_RPS
              value: "50"
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: swarmlab-data
---
apiVersion: v1
kind: Service
metadata:
  name: swarmlab
spec:
  selector: {app: swarmlab}
  ports:
    - {name: http, port: 80, targetPort: http}
