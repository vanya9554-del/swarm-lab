[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-lab"
version = "6.4.0"
description = "Agent-native swarm runtime: task market, discovery, SSE, MCP, PostgreSQL"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["swarmlab*"]
